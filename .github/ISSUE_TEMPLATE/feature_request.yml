name: Feature request
description: Propose a focused product improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem and who experiences it.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 192" role="img" aria-labelledby="title desc">
  <title id="title">Track mark reversed</title>
  <desc id="desc">Abstract chat and workflow mark for Track on dark backgrounds.</desc>
  <defs>
    <style>
      .light { fill: #faf7f2; }
      .muted { fill: #8f8a83; }
      .yellow { fill: none; stroke: #f0b100; stroke-width: 17; stroke-linecap: round; stroke-linejoin: round; }
      .yellow-fill { fill: #f0b100; }
      .cutout { fill: #1b1917; }
    </style>
  </defs>

  <rect class="muted" x="8" y="28" width="25" height="12" rx="6" />
  <rect class="muted" x="51" y="28" width="35" height="12" rx="6" />
  <rect class="light" x="124" y="28" width="47" height="12" rx="6" />
  <rect class="light" x="196" y="28" width="62" height="12" rx="6" />

  <rect class="muted" x="36" y="70" width="23" height="12" rx="6" />
  <rect class="muted" x="77" y="70" width="70" height="12" rx="6" />
  <rect class="light" x="164" y="70" width="96" height="12" rx="6" />

  <rect class="muted" x="8" y="112" width="18" height="12" rx="6" />
  <rect class="muted" x="50" y="112" width="80" height="12" rx="6" />

  <rect class="muted" x="35" y="154" width="31" height="12" rx="6" />
  <rect class="light" x="156" y="154" width="87" height="12" rx="6" />

  <path class="yellow" d="M76 148 H126 C143 148 146 118 164 118 H238" />
  <circle class="yellow-fill" cx="252" cy="118" r="22" />
